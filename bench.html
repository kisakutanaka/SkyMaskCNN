<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SkyMaskCNN 計測</title>
<style>
  :root { --gutter: 8px; }
  body { margin: 0; background: #111; color: #ddd; font: 13px/1.5 system-ui, sans-serif; }
  header { display: flex; gap: 12px; align-items: center; padding: 8px 12px; flex-wrap: wrap; }
  #stats { font-variant-numeric: tabular-nums; color: #7c7; }
  /* 余白は1か所で持つ。ソロ表示の重ね合わせが同じ値に依存するため。 */
  .panes { display: flex; gap: var(--gutter); padding: 0 var(--gutter) var(--gutter); position: relative; }
  .pane { flex: 1 1 0; min-width: 0; }

  /* 分離結果のソロ表示。元映像は「消す」のではなく分離結果の真裏に重ねる。
     video を display:none にしても画面外へ出しても、ブラウザは更新を止めてしまい
     requestVideoFrameCallback が呼ばれなくなる（動画とカメラで ms/frame が止まる）。
     画面内に置いたまま不透明なキャンバスで覆えば、更新は続いたまま見えなくなる。
     元映像と分離結果は同じソース＝同じ幅・同じ縦横比なので過不足なく重なる。 */
  body.solo .panes > .pane:first-child {
    position: absolute; top: 0; left: var(--gutter); right: var(--gutter); z-index: 0;
  }
  body.solo .panes > .pane:last-child { position: relative; z-index: 1; }
  /* 見出しは箱だけ残して文字を消す。display:none にすると高さが変わって重なりがずれる。 */
  body.solo .panes > .pane:first-child h2 { visibility: hidden; }
  .pane h2 { margin: 0 0 4px; font-size: 12px; font-weight: 400; color: #888; }
  video, img, canvas { width: 100%; display: block; background: #000; }
  /* 作者スタイルの display:block が UA の [hidden]{display:none} を打ち消すので明示する */
  [hidden] { display: none !important; }
  .pane { align-self: flex-start; }
  select { font: inherit; padding: 3px 6px; }
  /* 計測版にだけあるもの */
  #howto { margin: 0 12px 8px; color: #ca8; font-size: 12px; max-width: 46em; }
  #howto a { color: #8ad; }
  #breakdown { margin: 0 12px 8px; padding: 8px 10px; background: #000; color: #7c7;
    font: 12px/1.5 ui-monospace, monospace; font-variant-numeric: tabular-nums;
    white-space: pre; overflow-x: auto; }
</style>

<header>
  <select id="source"></select>
  <select id="mode">
    <option value="kaiju">怪獣合成</option>
    <option value="fill">空塗りつぶし</option>
  </select>
  <input type="color" id="fillColor" value="#ff00ff">
  <label><input type="checkbox" id="solo"> 分離のみ</label>
  <span id="stats">—</span>
</header>

<!-- ここから下は計測版にだけあるもの。本番の index.html には無い。 -->
<p id="howto">
  <b>これは計測用のページです。</b>本番は <a href="./">index.html</a>。
  ソースで「カメラ」を選び、画面を消さずに 1 分ほど回してください。
  <b>開始直後と 1 分後の両方</b>を控えます（熱ダレで配分が変わるため）。
  <br>refineSize（取り込みと読み戻しの解像度。inputSize 256 の整数倍に丸め）:
  <a href="?refine=512">512（現行）</a> / <a href="?refine=256">256</a>
  <br>coeffSize（ガイデッド係数を求める解像度。2 の冪に丸め）:
  <a href="?coeff=128">128（現行）</a> / <a href="?coeff=256">256</a>
  <br>depth（同時に Worker へ投げる枚数）:
  <a href="?depth=2">2（現行）</a> / <a href="?depth=1">1</a>
  <br>実際に効いた値は下の行に出ます。
</p>
<pre id="breakdown">計測待ち…</pre>

<div class="panes">
  <div class="pane">
    <h2>元映像</h2>
    <video id="video" muted loop playsinline hidden></video>
    <img id="still" hidden>
  </div>
  <div class="pane"><h2>背景分離</h2><canvas id="out"></canvas></div>
</div>


<script type="module">
// ?v= は古いキャッシュとの食い違いを防ぐための版数。sky-segmenter.js /
// sky-segmenter.worker.js に手を入れたら、ここと sky-segmenter.js の両方を上げる。
// （片方だけ新しくなると、新しい index.html が古い API を呼んで静かに止まる）
import { createSkySegmenter } from './sky-segmenter.js?v=2';

// テストソース。増やすときはここに1行足すだけ。
const SOURCES = [
  { label: '動画 (薄暮・パン)', kind: 'video', src: 'img/IMG_4476.mp4' },
  { label: '曇天 01',           kind: 'still', src: 'img/cloudy01.png' },
  { label: '曇天 02',           kind: 'still', src: 'img/cloudy02.png' },
  { label: 'カメラ',            kind: 'camera' },
];

// 処理解像度はモデル側で決まる。tinyskynet_skyseg_256 は入力 256×256 固定
// （出力は 128×128 のロジット）で、それをガイデッドフィルタで refineSize まで
// 起こしたものがマスクになる。SkyMaskCV の PROC_PIXELS に相当するつまみはここ。
// 入力が正方形固定なので縦横比は一度潰し、マスクを元の縦横比へ引き伸ばして戻す。
// 計測版は ?refine= と ?coeff= で切り替えられる。
const params = new URLSearchParams(location.search);
const REFINE = Number(params.get('refine')) || 512;
const COEFF = Number(params.get('coeff')) || 128;
const DEPTH_Q = Number(params.get('depth')) || 0;
const SEGMENTER_OPTIONS = {
  modelUrl: './models/tinyskynet_skyseg_256.onnx',
  refineSize: REFINE,
  coeffSize: COEFF,
};

// 同時に Worker へ投げておく枚数。1 だと「投げる→待つ→次を投げる」になり、
// 往復の待ち時間のあいだ Worker が遊ぶ（実機で 1 枚 46ms のうち 14ms が
// メッセージの往復待ちだった。Mac では 0.1ms なので iOS 側の配送の都合）。
// 2 にすると次の 1 枚が Worker の手元に積まれるので、その待ちが隠れる。
// 引き換えに、表示は 1 枚ぶん余分に古くなる。
const DEPTH = DEPTH_Q || 2;

const video = document.getElementById('video');
const still = document.getElementById('still');
const mode = document.getElementById('mode');
const fillColor = document.getElementById('fillColor');
const out = document.getElementById('out');
const outCtx = out.getContext('2d');

const maskCv = makeCanvas(1, 1);             // マスクをアルファとして持つ
let maskImg = null;                          // 解像度が変わるたびに作り直す
const fg = makeCanvas(1, 1);                 // 手前レイヤー: 空を抜いた元映像

// 分離に渡したフレームの控え。マスクが届いたら「そのマスクを作った元のフレーム」と
// 対で合成する。最新フレームに古いマスクを載せると、カメラを振ったときに輪郭が
// 1〜3 フレーム分ずれるため。表示レートは分離レートまで落ちるが、出る絵は必ず整合する。
// 投げてある DEPTH 枚 + 表示中の 1 枚 + 余裕 1 枚。余裕がないと、表示した直後の
// 1 枚に次のフレームを描いてしまい、モード変更などで描き直したときだけ
// 「新しい映像 + 古いマスク」になる（合成そのものは順序が守られるので出ない）。
const shots = Array.from({ length: DEPTH + 2 }, () => makeCanvas(1, 1));
let shotIdx = 0;
let display = null;                          // いま合成に使うフレーム（マスクと対）

let segmenter = null;                        // モデル読み込み完了まで null

const kaiju = new Image();
kaiju.src = 'kaiju.png';

function makeCanvas(w, h) {
  const el = document.createElement('canvas');
  el.width = w; el.height = h;
  return { el, ctx: el.getContext('2d', { willReadFrequently: true }) };
}

/** いま描画元になっている要素と、その実寸 */
let active = video;
const sizeOf = (el) => el === video
  ? [el.videoWidth, el.videoHeight]
  : [el.naturalWidth, el.naturalHeight];

// --- マスクの取り込み ---
// 古典CV版は 0/1 の二値だが、CNN はそのまま確率を返す。しきい値で潰さずに
// アルファへ流し込むと、境界が確率のままぼけて合成が馴染む。
function updateMask({ width, height, data }) {
  if (maskCv.el.width !== width || maskCv.el.height !== height) {
    maskCv.el.width = width; maskCv.el.height = height;
    maskImg = maskCv.ctx.createImageData(width, height);
  }
  for (let i = 0; i < data.length; i++) maskImg.data[i * 4 + 3] = data[i] * 255;
  maskCv.ctx.putImageData(maskImg, 0, 0);
}

// --- 描画 ---
// マスクと、そのマスクを作った元のフレームが揃ったときだけ描く。
// 毎フレーム描いて最新の映像に古いマスクを載せると、カメラを振ったときに
// 輪郭がずれる。表示は分離のレートになるが、出る絵は必ず整合している。
function renderFrame() {
  if (!display) return;
  const vw = display.el.width;
  const vh = display.el.height;
  if (!vw) return;

  if (out.width !== vw || out.height !== vh) {
    out.width = vw; out.height = vh;
    fg.el.width = vw; fg.el.height = vh;
  }

  const t0 = performance.now();

  // --- 1. 手前レイヤー: 元映像から空を抜く ---
  fg.ctx.globalCompositeOperation = 'source-over';
  fg.ctx.clearRect(0, 0, vw, vh);
  fg.ctx.drawImage(display.el, 0, 0);
  fg.ctx.globalCompositeOperation = 'destination-out';
  fg.ctx.drawImage(maskCv.el, 0, 0, vw, vh);   // GPU が拡大（正方形→元の縦横比に戻る）

  // --- 2. 奥から順に重ねる ---
  // 手前レイヤー（空を抜いた元映像 = 建物）は両モード共通。奥だけが違う。
  if (mode.value === 'fill') {
    outCtx.fillStyle = fillColor.value;
    outCtx.fillRect(0, 0, vw, vh);             // 奥:   単色プレーン
  } else {
    outCtx.drawImage(display.el, 0, 0);        // 奥:   元映像（空はここが見える）
    drawKaiju(vw, vh);                         // 中:   怪獣（加工なし）
  }
  outCtx.drawImage(fg.el, 0, 0);               // 手前: 空を抜いた元映像 = 建物

  // drawImage は GPU に積むだけで完了を待たないので、合成の実コストは
  // ここに全部は現れない。それでも合成の発行は区間に入る。
  accDraw += performance.now() - t0; nDraw++;
}

// モードや色を変えたときは、次のマスクを待たずに描き直す
mode.onchange = renderFrame;
fillColor.oninput = renderFrame;

// 大きさも位置も「高さ」基準で決める。幅基準にすると横長のソースで
// 幅由来の大きさが画面の高さを超え、上にはみ出す（cloudy01 で発生）。
const KAIJU_HEIGHT = 0.40;   // 画面の高さに対する怪獣の高さ
const KAIJU_FEET   = 0.58;   // 足元を置く高さ（0=上端, 1=下端）

function drawKaiju(vw, vh) {
  if (!kaiju.complete) return;
  const h = vh * KAIJU_HEIGHT;
  const w = h * kaiju.width / kaiju.height;
  outCtx.drawImage(kaiju, (vw - w) / 2, vh * KAIJU_FEET - h, w, h);
}

// --- 計測 ---
// 表示は「マスクとフレームの対が揃うたび」なので、描画レートは分離レートと
// 同じになる。SkyMaskCV の「ms/frame」に対応するのは「分離 ms/枚」のほう。
// 「遅れ」は投げてから返るまでで、DEPTH 枚を同時に投げているぶん ms/枚 より長い。
// 左の元映像だけはカメラのレートで動く。
const stats = document.getElementById('stats');
let accDraw = 0, nDraw = 0, lastStats = performance.now();
let segMs = 0, segCount = 0, lastTimings = null;
let fatal = false;                             // 出たら stats はエラー表示のまま固定
let loopStarted = 0;
function report() {
  if (fatal) return;
  const now = performance.now();
  const span = now - lastStats;
  if (span < 1) return;
  if (!nDraw) {                                // まだ 1 枚も出ていない
    if (loopStarted && now - loopStarted > 6000) {
      stats.textContent = '分離の結果が返ってきません（再読み込みしてください）';
    }
    lastStats = now;
    return;
  }
  const drawFps = (nDraw / span) * 1000;
  const segFps = (segCount / span) * 1000;
  const period = segCount ? span / segCount : 0;
  stats.textContent = `表示 ${drawFps.toFixed(0)} fps (合成 ${(accDraw / nDraw).toFixed(2)} ms)`
                    + `  分離 ${period.toFixed(1)} ms/枚 → ${segFps.toFixed(1)} fps`
                    + `  遅れ ${segMs.toFixed(0)} ms`
                    + `  ${maskCv.el.width}×${maskCv.el.height}`;
  accDraw = 0; nDraw = 0; segCount = 0; lastStats = now;
}
setInterval(report, 1000);

// --- ループ ---
// 1 本だけ。分離が 1 枚終わるたびに、その元フレームと対で描く。
// await を跨ぐので、次の1枚は必ず前の1枚が終わってから投げる
// （重ねると古い結果を待つ遅れが積み上がる）。
let loopId = 0;
function startLoop() {
  const id = ++loopId;
  loopStarted = performance.now();
  // ループ全体を囲む。どこで転んでも画面に出す。ここを細かく囲むと、
  // 囲み忘れたところで例外が出たときにループごと静かに死ぬ（実際に
  // recycle() の追加でそれが起きた: 古いキャッシュの sky-segmenter.js には
  // その関数が無く、背景分離が 1 枚も出ないまま止まっていた）。
  (async () => {
    const inflight = [];                       // 投げてあるぶん（先頭が最も古い）
    while (id === loopId) {
      const [vw, vh] = sizeOf(active);
      if (!segmenter || !vw) {                 // 準備前、または寸法がまだ来ていない
        await new Promise((r) => requestAnimationFrame(r));
        continue;
      }

      // --- 1. 投げられるだけ投げる ---
      // 控えは segment() と同じ同期ブロックで撮る。segment() の中の取り込み
      // （drawImage）も await より手前で走るので、両者は必ず同じ1枚を見る。
      while (inflight.length < DEPTH) {
        const shot = shots[shotIdx];
        shotIdx = (shotIdx + 1) % shots.length;
        if (shot.el.width !== vw || shot.el.height !== vh) {
          shot.el.width = vw; shot.el.height = vh;
        }
        shot.ctx.drawImage(active, 0, 0, vw, vh);
        inflight.push({ shot, at: performance.now(), pending: segmenter.segment(active) });
      }

      // --- 2. いちばん古いぶんを待つ ---
      const job = inflight.shift();
      const mask = await job.pending;
      if (id !== loopId) return;               // await の間に切り替わっていたら捨てる
      segMs = performance.now() - job.at;      // 投げてから返るまで（＝表示の遅れ）
      segCount++;
      lastTimings = mask.timings;              // 工程別の内訳（bench.html が読む）
      pushTimings(segMs, mask.timings);        // ← 計測版だけ

      // --- 3. 対で出す。バッファは返して使い回してもらう ---
      updateMask(mask);
      segmenter.recycle(mask);
      display = job.shot;
      renderFrame();
    }
  })().catch((err) => {
    console.error(err);
    fatal = true;
    stats.textContent = `止まりました: ${err.message}（再読み込みしてください）`;
  });
}
globalThis.segTimings = () => lastTimings;     // 計測ページ用の覗き窓

// --- 計測版の内訳表示 ---
// 直近 60 フレームの中央値。実機では Mac に繋がないとコンソールが見られないので
// そのまま読めるようにしておく。値は Worker が performance.now() で測った生の ms。
const KEEP = 60;
const rings = new Map();
function pushTimings(totalMs, t) {
  const add = (k, v) => {
    let a = rings.get(k);
    if (!a) rings.set(k, (a = []));
    a.push(v);
    if (a.length > KEEP) a.shift();
  };
  add('分離（呼び出し側の計測）', totalMs);
  for (const [k, v] of Object.entries(t)) add(k === '合計' ? 'Worker 内の合計' : k, v);
}
const median = (a) => { const s = [...a].sort((x, y) => x - y); return s[s.length >> 1]; };

const breakdown = document.getElementById('breakdown');
const t0 = performance.now();
const pad = (s, w) => s + ' '.repeat(Math.max(0, w - [...s].reduce((n, c) => n + (c.charCodeAt(0) > 0x2e80 ? 2 : 1), 0)));
setInterval(() => {
  if (!rings.size) return;
  const total = median(rings.get('分離（呼び出し側の計測）'));
  const rows = [...rings].map(([k, a]) => {
    const ms = median(a);
    const pct = k.startsWith('分離') || k.startsWith('Worker') ? '' : `  ${((ms / total) * 100).toFixed(1).padStart(5)} %`;
    return `  ${pad(k, 26)}${ms.toFixed(1).padStart(6)} ms${pct}`;
  });
  breakdown.textContent =
    `取り込み ${segmenter?.maskSize ?? '?'}² / 係数 ${segmenter?.coeffSize ?? '?'}²`
    + ` / 経過 ${((performance.now() - t0) / 1000).toFixed(0)} 秒`
    + ` / 直近 ${rings.get('分離（呼び出し側の計測）').length} フレームの中央値\n`
    + rows.join('\n');
}, 1000);

// --- ソース切替 ---
const select = document.getElementById('source');
SOURCES.forEach((s, i) => select.add(new Option(s.label, String(i))));

async function selectSource(i) {
  const s = SOURCES[i];

  loopId++;                                    // 走っているループをまず止める
  display = null;                              // 縦横比が変わるので前の対は捨てる
  video.srcObject?.getTracks().forEach((t) => t.stop());
  video.srcObject = null;
  video.removeAttribute('src');
  video.load();

  if (s.kind === 'still') {
    active = still;
    video.hidden = true; still.hidden = false;
    still.src = s.src;
    await still.decode().catch(() => {});
  } else {
    active = video;
    still.hidden = true; video.hidden = false;
    if (s.kind === 'camera') {
      video.srcObject = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: 'environment', width: { ideal: 1280 } }, audio: false,
      });
    } else {
      video.src = s.src;
    }
    await video.play().catch(() => {});
  }

  stats.textContent = '—';
  accDraw = 0; nDraw = 0; segCount = 0; lastStats = performance.now();
  startLoop();
}

select.onchange = () => selectSource(Number(select.value));

// 元映像を引っ込めて分離結果だけを大きく出す。処理解像度は表示と独立なので
// 速度にも品質にも影響しない。
const solo = document.getElementById('solo');
solo.onchange = () => document.body.classList.toggle('solo', solo.checked);
solo.onchange();                              // 再読み込みで checked が復元される環境に備える

// モデル（約 200KB）と wasm を取ってくるまでは 1 フレームも回せない。
// ここだけが古典CV版と違って「起動を待つ」工程になる。
stats.textContent = 'モデルを読み込んでいます…';
try {
  segmenter = await createSkySegmenter(SEGMENTER_OPTIONS);
  selectSource(0);
} catch (err) {
  console.error(err);
  fatal = true;
  stats.textContent = `モデルを読み込めませんでした: ${err.message}`;
}
</script>
